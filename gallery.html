<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | 部屋のノート</title>
<meta name="description" content="インテリアをテーマにした漫画とイラストを置いておくページ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#191970;
  --navy-deep:#0f0f4a;
  --orange:#ff8c00;
  --cream:#fff4e6;
  --ink:#191970;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.9;font-size:16px}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

/* header */
header{background:var(--navy);color:var(--cream);position:sticky;top:0;z-index:10;border-bottom:3px solid var(--orange)}
.bar{max-width:1040px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:700;font-size:1.25rem;text-decoration:none;letter-spacing:.08em}
nav ul{list-style:none;display:flex;gap:6px;flex-wrap:wrap}
nav a{display:block;padding:6px 14px;text-decoration:none;font-size:.95rem;border-radius:999px;transition:background .2s}
nav a:hover{background:rgba(255,140,0,.25)}
nav a[aria-current="page"]{background:var(--orange);color:var(--navy);font-weight:700}

/* page title */
.title{background:var(--navy);color:var(--cream);padding:48px 24px 52px}
.title .wrap{max-width:1040px;margin:0 auto}
.title h1{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.4rem);letter-spacing:.06em;line-height:1.5}
.title p{margin-top:10px;opacity:.9}

/* filter */
.filter{max-width:1040px;margin:0 auto;padding:36px 24px 0;display:flex;gap:10px;flex-wrap:wrap}
.filter button{font:inherit;font-weight:700;cursor:pointer;padding:8px 22px;border-radius:999px;border:2px solid var(--navy);background:transparent;color:var(--navy);transition:background .2s,color .2s}
.filter button:hover{background:rgba(25,25,112,.1)}
.filter button[aria-pressed="true"]{background:var(--navy);color:var(--cream)}

/* grid */
main{padding-bottom:72px}
.grid{max-width:1040px;margin:0 auto;padding:28px 24px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.item[hidden]{display:none}
.item a{display:block;text-decoration:none}
.frame{border:6px solid var(--navy);background:#fff;padding:8px;box-shadow:8px 8px 0 var(--orange);transition:transform .2s,box-shadow .2s}
.item a:hover .frame{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--orange)}
.frame img{display:block;width:100%;height:auto}
.ph{width:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--cream);letter-spacing:.1em}
.ph.ill{aspect-ratio:1/1;background:linear-gradient(160deg,var(--navy) 55%,var(--orange) 55%)}
.ph.man{aspect-ratio:3/4;background:repeating-linear-gradient(90deg,var(--navy) 0 18px,#24249a 18px 36px)}
.cap{margin-top:20px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cap .tag{font-size:.78rem;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--orange);color:var(--navy)}
.cap .name{font-weight:700}

footer{background:var(--navy);color:var(--cream);text-align:center;padding:28px 24px;border-top:3px solid var(--orange);font-size:.9rem}

@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .title{padding:36px 20px 40px}
  .filter{padding:28px 20px 0}
  .grid{padding:24px 20px 0;gap:24px}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  nav a,.filter button,.frame{transition:none}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="index.html">部屋のノート</a>
    <nav aria-label="メインメニュー">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="gallery.html" aria-current="page">Gallery</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="title">
  <div class="wrap">
    <h1>作品置き場</h1>
    <p>インテリアをテーマにした漫画とイラストを置いています。</p>
  </div>
</div>

<main>
  <div class="filter" role="group" aria-label="作品の絞り込み">
    <button type="button" data-filter="all" aria-pressed="true">すべて</button>
    <button type="button" data-filter="ill" aria-pressed="false">イラスト</button>
    <button type="button" data-filter="man" aria-pressed="false">漫画</button>
  </div>

  <!--
    画像の差し替え方:
    <div class="ph ill">…</div> の部分を
    <img src="images/ファイル名.png" alt="作品の説明"> に置き換えてください。
    作品を増やすときは <li class="item"> のかたまりをコピーします。
  -->
  <ul class="grid" style="list-style:none">
    <li class="item" data-cat="ill">
      <a href="#"><div class="frame"><div class="ph ill">IMAGE</div></div>
        <div class="cap"><span class="tag">イラスト</span><span class="name">夜のリビング</span></div></a>
    </li>
    <li class="item" data-cat="man">
      <a href="#"><div class="frame"><div class="ph man">MANGA</div></div>
        <div class="cap"><span class="tag">漫画</span><span class="name">模様替えの夜</span></div></a>
    </li>
    <li class="item" data-cat="ill">
      <a href="#"><div class="frame"><div class="ph ill">IMAGE</div></div>
        <div class="cap"><span class="tag">イラスト</span><span class="name">窓辺のランプ</span></div></a>
    </li>
    <li class="item" data-cat="ill">
      <a href="#"><div class="frame"><div class="ph ill">IMAGE</div></div>
        <div class="cap"><span class="tag">イラスト</span><span class="name">ソファのある部屋</span></div></a>
    </li>
    <li class="item" data-cat="man">
      <a href="#"><div class="frame"><div class="ph man">MANGA</div></div>
        <div class="cap"><span class="tag">漫画</span><span class="name">はじめての一人暮らし</span></div></a>
    </li>
    <li class="item" data-cat="ill">
      <a href="#"><div class="frame"><div class="ph ill">IMAGE</div></div>
        <div class="cap"><span class="tag">イラスト</span><span class="name">観葉植物のすみっこ</span></div></a>
    </li>
  </ul>
</main>

<footer>
  <p>&copy; 2026 部屋のノート</p>
</footer>

<script>
(function(){
  var buttons = document.querySelectorAll('.filter button');
  var items = document.querySelectorAll('.item');
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var f = btn.getAttribute('data-filter');
      buttons.forEach(function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      items.forEach(function(it){
        it.hidden = !(f === 'all' || it.getAttribute('data-cat') === f);
      });
    });
  });
})();
</script>

</body>
</html>
